<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="gallery-header">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="theme-icon">🌙</span>
        </button>
        <h1>Photography Portfolio</h1>
        <p>A curated collection of moments captured in time.</p>
    </header>

    <main class="gallery-container" id="gallery-container">
        <!-- Loading skeleton will be shown here initially -->
        <div class="loading-state" id="loading-state">
            <div class="skeleton-loader">
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
                <div class="skeleton-item"></div>
            </div>
        </div>
        
        <!-- Error state (hidden by default) -->
        <div class="error-state" id="error-state" style="display: none;">
            <div class="error-content">
                <h2>Oops! Something went wrong</h2>
                <p>Unable to load the gallery. Please try again later.</p>
                <button class="retry-button" id="retry-button">Try Again</button>
            </div>
        </div>
        
        <!-- Gallery items will be dynamically inserted here -->
    </main>

    <footer class="gallery-footer">
        <p>&copy; 2025 Your Name. All rights reserved.</p>
    </footer>

    <div id="lightbox" class="lightbox">
        <span class="close-button">&times;</span>
        <img class="lightbox-content" id="lightbox-img" src="">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
